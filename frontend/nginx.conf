server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # Docker DNS: re-resolve backend after container recreate.
  # Without this nginx pins the old backend IP and /api webhooks go 502 after deploy.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://forgecrm-backend:3011;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # SSE endpoint — must stream, not buffer; long-lived connections.
  location = /api/events {
    proxy_pass $backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    chunked_transfer_encoding on;
  }

  location /api {
    proxy_pass $backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /uploads {
    proxy_pass $backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /l/ {
    proxy_pass $backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
